name: Deploy Admin Page

# admin/ 폴더(정적 관리자 페이지)를 GitHub Pages로 배포한다.
# 저장소 Settings → Pages → Build and deployment → Source 를
# "GitHub Actions"로 설정해야 동작한다 (최초 1회 수동 설정 필요).

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload admin/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "admin"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
