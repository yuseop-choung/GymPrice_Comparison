<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GymPrice Admin</title>
<link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"></script>
<script src="shared.js?v=3"></script>
<script>
(function () {
  var G = window.GymPriceAdmin;
  var app = document.getElementById("app");
  var currentTab = "pending";
  var currentItems = [];

  function renderAdmin(sb, currentUser, renderLogin) {
    app.innerHTML =
      '<div class="top-row">' +
      '  <div><h1 style="margin-bottom:0">GymPrice Admin</h1>' +
      '  <div class="who">' + G.escapeHtml(currentUser.nickname || currentUser.email) + '님으로 로그인됨</div></div>' +
      '  <button class="btn-ghost" id="logout">로그아웃</button>' +
      '</div>' +
      G.renderNav("index") +
      '<div class="tabs">' +
      '  <div class="tab" data-tab="pending">심사 대기</div>' +
      '  <div class="tab" data-tab="approved">승인됨</div>' +
      '  <div class="tab" data-tab="rejected">거절됨</div>' +
      '</div>' +
      '<input id="price-search" placeholder="헬스장 이름으로 검색" style="margin-bottom:12px" />' +
      '<div id="list"><div class="empty">불러오는 중...</div></div>';

    document.getElementById("logout").onclick = function () {
      sb.auth.signOut().then(function () { renderLogin(); });
    };
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (el) {
      el.onclick = function () {
        currentTab = el.getAttribute("data-tab");
        loadList(sb);
      };
    });
    document.getElementById("price-search").addEventListener("input", function () {
      renderList(sb, filterItems(currentItems));
    });
    loadList(sb);
    G.loadPendingBadge(sb);
  }

  function filterItems(items) {
    var q = document.getElementById("price-search").value.trim().toLowerCase();
    if (!q) return items;
    return items.filter(function (item) {
      var name = (item.gyms && item.gyms.name) || "";
      return name.toLowerCase().indexOf(q) !== -1;
    });
  }

  function loadList(sb) {
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (el) {
      el.classList.toggle("active", el.getAttribute("data-tab") === currentTab);
    });
    var listEl = document.getElementById("list");
    listEl.innerHTML = '<div class="empty">불러오는 중...</div>';

    sb.from("gym_prices")
      .select("*, gyms(name, address), users(nickname, email)")
      .eq("status", currentTab)
      .order("created_at", { ascending: false })
      .then(function (res) {
        if (res.error) {
          listEl.innerHTML = '<div class="error-text">' + G.escapeHtml(res.error.message) + '</div>';
          return;
        }
        currentItems = res.data || [];
        renderList(sb, filterItems(currentItems));
        G.loadPendingBadge(sb);
      });
  }

  function renderList(sb, items) {
    var listEl = document.getElementById("list");
    if (items.length === 0) {
      listEl.innerHTML = '<div class="empty">해당하는 제보가 없습니다.</div>';
      return;
    }

    var badgeClass = { pending: "status-pending", approved: "status-approved", rejected: "status-rejected" };
    var badgeText = { pending: "심사중", approved: "승인됨", rejected: "거절됨" };

    listEl.innerHTML = items.map(function (item) {
      var gym = item.gyms || {};
      var submitter = item.users || {};
      var actionsHtml = "";
      if (item.status === "pending") {
        actionsHtml =
          '<div class="actions">' +
          '  <button class="btn-approve" data-action="approved" data-id="' + item.id + '">승인</button>' +
          '  <button class="btn-reject" data-action="rejected" data-id="' + item.id + '">거절</button>' +
          '</div>';
      } else {
        actionsHtml =
          '<div class="actions">' +
          '  <button class="btn-revert" data-action="pending" data-id="' + item.id + '">심사 대기로 되돌리기</button>' +
          '</div>';
      }
      actionsHtml +=
        '<div class="actions" style="margin-top:6px">' +
        '  <button class="btn-reject" data-delete-id="' + item.id + '">완전 삭제</button>' +
        '</div>';

      return (
        '<div class="card">' +
        '  <span class="status-badge ' + badgeClass[item.status] + '">' + badgeText[item.status] + '</span>' +
        '  <div class="price-name">' + G.escapeHtml(gym.name || "알 수 없는 헬스장") + '</div>' +
        '  <div class="price-address">' + G.escapeHtml(gym.address || "") + '</div>' +
        '  <div class="price-grid">' +
        '    <div class="price-item"><span>1개월</span><b>' + G.fmtPrice(item.price_1m) + '</b></div>' +
        '    <div class="price-item"><span>3개월</span><b>' + G.fmtPrice(item.price_3m) + '</b></div>' +
        '    <div class="price-item"><span>6개월</span><b>' + G.fmtPrice(item.price_6m) + '</b></div>' +
        '    <div class="price-item"><span>12개월</span><b>' + G.fmtPrice(item.price_12m) + '</b></div>' +
        '  </div>' +
        (item.memo ? '<div class="memo">' + G.escapeHtml(item.memo) + '</div>' : '') +
        '  <div class="meta">제보자: ' + G.escapeHtml(submitter.nickname || submitter.email || "알 수 없음") + ' · ' + G.fmtDate(item.created_at) + '</div>' +
        actionsHtml +
        '</div>'
      );
    }).join("");

    Array.prototype.forEach.call(listEl.querySelectorAll("button[data-action]"), function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-id");
        var nextStatus = btn.getAttribute("data-action");
        btn.disabled = true;
        sb.from("gym_prices").update({ status: nextStatus }).eq("id", id).then(function (res) {
          if (res.error) {
            alert("처리 실패: " + res.error.message);
            btn.disabled = false;
            return;
          }
          loadList(sb);
        });
      };
    });

    Array.prototype.forEach.call(listEl.querySelectorAll("button[data-delete-id]"), function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-delete-id");
        if (!confirm("이 가격 제보를 완전히 삭제할까요? 되돌릴 수 없습니다.")) return;
        btn.disabled = true;
        sb.from("gym_prices").delete().eq("id", id).then(function (res) {
          if (res.error) {
            alert("삭제 실패: " + res.error.message);
            btn.disabled = false;
            return;
          }
          loadList(sb);
        });
      };
    });
  }

  G.boot(app, renderAdmin, "가격 제보 심사 도구");
})();
</script>
</body>
</html>
