<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GymPrice Admin</title>
<style>
  :root {
    --bg: #F9FAFB;
    --surface: #FFFFFF;
    --surface-2: #F3F4F6;
    --text: #111827;
    --text-secondary: #6B7280;
    --border: #E5E7EB;
    --primary: #2563EB;
    --primary-weak: #EFF6FF;
    --error: #DC2626;
    --error-weak: #FEF2F2;
    --success: #16A34A;
    --success-weak: #F0FDF4;
    --pending: #D97706;
    --pending-weak: #FFFBEB;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0F17;
      --surface: #151B26;
      --surface-2: #1C2331;
      --text: #F3F4F6;
      --text-secondary: #9CA3AF;
      --border: #2A3241;
      --primary: #60A5FA;
      --primary-weak: #17233A;
      --error: #F87171;
      --error-weak: #2A1616;
      --success: #4ADE80;
      --success-weak: #142418;
      --pending: #FBBF24;
      --pending-weak: #2A2210;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0F17;
    --surface: #151B26;
    --surface-2: #1C2331;
    --text: #F3F4F6;
    --text-secondary: #9CA3AF;
    --border: #2A3241;
    --primary: #60A5FA;
    --primary-weak: #17233A;
    --error: #F87171;
    --error-weak: #2A1616;
    --success: #4ADE80;
    --success-weak: #142418;
    --pending: #FBBF24;
    --pending-weak: #2A2210;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
  }
  #app {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 4px 0 2px;
  }
  .sub {
    color: var(--text-secondary);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    margin-top: 14px;
  }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--text);
  }
  input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    width: 100%;
    margin-top: 16px;
    padding: 12px;
  }
  .btn-primary:disabled { opacity: .6; cursor: default; }
  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-approve { background: var(--success-weak); color: var(--success); }
  .btn-reject { background: var(--error-weak); color: var(--error); }
  .btn-revert { background: var(--surface-2); color: var(--text-secondary); }
  .error-text {
    color: var(--error);
    font-size: 13px;
    margin-top: 10px;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .who { font-size: 13px; color: var(--text-secondary); }
  .tabs {
    display: flex;
    gap: 6px;
    margin: 16px 0;
    overflow-x: auto;
  }
  .tab {
    background: var(--surface-2);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tab.active { background: var(--primary); color: #fff; }
  .price-name {
    font-size: 16px;
    font-weight: 700;
  }
  .price-address {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .price-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 16px;
    margin: 12px 0;
  }
  .price-item {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .price-item b { color: var(--text); }
  .memo {
    font-size: 13px;
    color: var(--text-secondary);
    background: var(--surface-2);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }
  .meta {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .actions {
    display: flex;
    gap: 8px;
  }
  .actions button { flex: 1; }
  .empty {
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    padding: 40px 0;
  }
  .status-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .status-pending { background: var(--pending-weak); color: var(--pending); }
  .status-approved { background: var(--success-weak); color: var(--success); }
  .status-rejected { background: var(--error-weak); color: var(--error); }
  a.reset-link {
    display: block;
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 24px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"></script>
<script>
(function () {
  var STORE_KEY = "gymprice_admin_config";
  // .env의 EXPO_PUBLIC_SUPABASE_URL/ANON_KEY와 동일한 값. anon key는 공개돼도 되는
  // 값이라(실제 보안은 RLS가 담당) 여기 하드코딩해도 안전하다. 다른 프로젝트로
  // 바꾸고 싶으면 로그인 화면의 "연결 정보 다시 입력하기"로 덮어쓸 수 있다.
  var DEFAULT_CONFIG = {
    url: "https://qupiubrowwkyoqzallyn.supabase.co",
    key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1cGl1YnJvd3dreW9xemFsbHluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MjIzNTMsImV4cCI6MjEwNDk5ODM1M30.rtsDr4kXCrGvycdjetIIvcYgpXuAD7UyaQnssuGdDuw"
  };
  var app = document.getElementById("app");
  var sb = null;
  var currentUser = null; // { id, email }
  var currentTab = "pending";

  function loadConfig() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }
  function saveConfig(cfg) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(cfg));
    } catch (e) {}
  }

  function fmtPrice(v) {
    if (v === null || v === undefined) return "-";
    return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "원";
  }
  function fmtDate(iso) {
    var d = new Date(iso);
    return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0");
  }
  function escapeHtml(s) {
    var div = document.createElement("div");
    div.textContent = s == null ? "" : String(s);
    return div.innerHTML;
  }

  // ---------- 1) 설정 화면 (Supabase URL / anon key) ----------
  function renderSetup(prefill) {
    app.innerHTML =
      '<h1>GymPrice Admin</h1>' +
      '<p class="sub">가격 제보 심사 도구 — 처음 한 번만 Supabase 프로젝트 정보를 입력하세요.</p>' +
      '<div class="card">' +
      '  <label for="url">Supabase URL</label>' +
      '  <input id="url" placeholder="https://xxxx.supabase.co" value="' + escapeHtml(prefill && prefill.url || "") + '" />' +
      '  <label for="key">Supabase anon key</label>' +
      '  <input id="key" placeholder="eyJhbGciOi..." value="' + escapeHtml(prefill && prefill.key || "") + '" />' +
      '  <div id="setup-error" class="error-text"></div>' +
      '  <button class="btn-primary" id="setup-submit">연결하기</button>' +
      '</div>';

    document.getElementById("setup-submit").onclick = function () {
      var url = document.getElementById("url").value.trim();
      var key = document.getElementById("key").value.trim();
      var errEl = document.getElementById("setup-error");
      if (!url || !key) {
        errEl.textContent = "URL과 anon key를 모두 입력해주세요.";
        return;
      }
      try {
        sb = supabase.createClient(url, key);
      } catch (e) {
        errEl.textContent = "연결에 실패했습니다: " + e.message;
        return;
      }
      saveConfig({ url: url, key: key });
      renderLogin();
    };
  }

  // ---------- 2) 로그인 화면 ----------
  function renderLogin(message) {
    app.innerHTML =
      '<h1>GymPrice Admin</h1>' +
      '<p class="sub">관리자 계정으로 로그인하세요.</p>' +
      '<div class="card">' +
      '  <label for="email">이메일</label>' +
      '  <input id="email" type="email" placeholder="admin@example.com" />' +
      '  <label for="password">비밀번호</label>' +
      '  <input id="password" type="password" placeholder="비밀번호" />' +
      '  <div id="login-error" class="error-text">' + escapeHtml(message || "") + '</div>' +
      '  <button class="btn-primary" id="login-submit">로그인</button>' +
      '</div>' +
      '<a class="reset-link" id="reset-config">Supabase 연결 정보 다시 입력하기</a>';

    document.getElementById("login-submit").onclick = doLogin;
    document.getElementById("password").addEventListener("keydown", function (e) {
      if (e.key === "Enter") doLogin();
    });
    document.getElementById("reset-config").onclick = function () {
      localStorage.removeItem(STORE_KEY);
      renderSetup();
    };
  }

  function doLogin() {
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;
    var errEl = document.getElementById("login-error");
    var btn = document.getElementById("login-submit");
    if (!email || !password) {
      errEl.textContent = "이메일과 비밀번호를 입력해주세요.";
      return;
    }
    btn.disabled = true;
    btn.textContent = "로그인 중...";
    sb.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
      if (res.error) {
        renderLogin(res.error.message);
        return;
      }
      checkAdminAndEnter(res.data.user);
    }).catch(function (e) {
      renderLogin(e.message || "로그인에 실패했습니다.");
    });
  }

  function checkAdminAndEnter(user) {
    sb.from("users").select("is_admin, nickname").eq("uid", user.id).maybeSingle()
      .then(function (res) {
        if (res.error) {
          renderLogin("프로필 조회 실패: " + res.error.message);
          return;
        }
        if (!res.data || !res.data.is_admin) {
          sb.auth.signOut();
          renderLogin("관리자 권한이 없는 계정입니다. (Supabase에서 이 계정의 is_admin을 true로 설정해야 합니다)");
          return;
        }
        currentUser = { id: user.id, email: user.email, nickname: res.data.nickname };
        renderAdmin();
      });
  }

  // ---------- 3) 관리자 화면 ----------
  function renderAdmin() {
    app.innerHTML =
      '<div class="top-row">' +
      '  <div><h1 style="margin-bottom:0">GymPrice Admin</h1>' +
      '  <div class="who">' + escapeHtml(currentUser.nickname || currentUser.email) + '님으로 로그인됨</div></div>' +
      '  <button class="btn-ghost" id="logout">로그아웃</button>' +
      '</div>' +
      '<div class="tabs">' +
      '  <div class="tab" data-tab="pending">심사 대기</div>' +
      '  <div class="tab" data-tab="approved">승인됨</div>' +
      '  <div class="tab" data-tab="rejected">거절됨</div>' +
      '</div>' +
      '<div id="list"><div class="empty">불러오는 중...</div></div>';

    document.getElementById("logout").onclick = function () {
      sb.auth.signOut().then(function () { renderLogin(); });
    };
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (el) {
      el.onclick = function () {
        currentTab = el.getAttribute("data-tab");
        loadList();
      };
    });
    loadList();
  }

  function loadList() {
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (el) {
      el.classList.toggle("active", el.getAttribute("data-tab") === currentTab);
    });
    var listEl = document.getElementById("list");
    listEl.innerHTML = '<div class="empty">불러오는 중...</div>';

    sb.from("gym_prices")
      .select("*, gyms(name, address), users(nickname, email)")
      .eq("status", currentTab)
      .order("created_at", { ascending: false })
      .then(function (res) {
        if (res.error) {
          listEl.innerHTML = '<div class="error-text">' + escapeHtml(res.error.message) + '</div>';
          return;
        }
        renderList(res.data || []);
      });
  }

  function renderList(items) {
    var listEl = document.getElementById("list");
    if (items.length === 0) {
      listEl.innerHTML = '<div class="empty">해당 상태의 제보가 없습니다.</div>';
      return;
    }

    var badgeClass = { pending: "status-pending", approved: "status-approved", rejected: "status-rejected" };
    var badgeText = { pending: "심사중", approved: "승인됨", rejected: "거절됨" };

    listEl.innerHTML = items.map(function (item) {
      var gym = item.gyms || {};
      var submitter = item.users || {};
      var actionsHtml = "";
      if (item.status === "pending") {
        actionsHtml =
          '<div class="actions">' +
          '  <button class="btn-approve" data-action="approved" data-id="' + item.id + '">승인</button>' +
          '  <button class="btn-reject" data-action="rejected" data-id="' + item.id + '">거절</button>' +
          '</div>';
      } else {
        actionsHtml =
          '<div class="actions">' +
          '  <button class="btn-revert" data-action="pending" data-id="' + item.id + '">심사 대기로 되돌리기</button>' +
          '</div>';
      }

      return (
        '<div class="card">' +
        '  <span class="status-badge ' + badgeClass[item.status] + '">' + badgeText[item.status] + '</span>' +
        '  <div class="price-name">' + escapeHtml(gym.name || "알 수 없는 헬스장") + '</div>' +
        '  <div class="price-address">' + escapeHtml(gym.address || "") + '</div>' +
        '  <div class="price-grid">' +
        '    <div class="price-item"><span>1개월</span><b>' + fmtPrice(item.price_1m) + '</b></div>' +
        '    <div class="price-item"><span>3개월</span><b>' + fmtPrice(item.price_3m) + '</b></div>' +
        '    <div class="price-item"><span>6개월</span><b>' + fmtPrice(item.price_6m) + '</b></div>' +
        '    <div class="price-item"><span>12개월</span><b>' + fmtPrice(item.price_12m) + '</b></div>' +
        '  </div>' +
        (item.memo ? '<div class="memo">' + escapeHtml(item.memo) + '</div>' : '') +
        '  <div class="meta">제보자: ' + escapeHtml(submitter.nickname || submitter.email || "알 수 없음") + ' · ' + fmtDate(item.created_at) + '</div>' +
        actionsHtml +
        '</div>'
      );
    }).join("");

    Array.prototype.forEach.call(listEl.querySelectorAll("button[data-action]"), function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-id");
        var nextStatus = btn.getAttribute("data-action");
        btn.disabled = true;
        sb.from("gym_prices").update({ status: nextStatus }).eq("id", id).then(function (res) {
          if (res.error) {
            alert("처리 실패: " + res.error.message);
            btn.disabled = false;
            return;
          }
          loadList();
        });
      };
    });
  }

  // ---------- 시작 ----------
  // 저장된 설정이 없으면(최초 실행) 기본값(DEFAULT_CONFIG)으로 바로 시작한다.
  var cfg = loadConfig() || DEFAULT_CONFIG;
  if (cfg && cfg.url && cfg.key) {
    sb = supabase.createClient(cfg.url, cfg.key);
    sb.auth.getSession().then(function (res) {
      var session = res.data && res.data.session;
      if (session) {
        checkAdminAndEnter(session.user);
      } else {
        renderLogin();
      }
    });
  } else {
    renderSetup();
  }
})();
</script>
</body>
</html>
