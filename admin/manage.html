<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GymPrice Admin</title>
<link rel="stylesheet" href="style.css?v=5" />
</head>
<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"></script>
<script src="shared.js?v=4"></script>
<script>
(function () {
  var G = window.GymPriceAdmin;
  var app = document.getElementById("app");
  var currentUser = null;
  var currentTab = "users"; // "users" | "gyms"
  var allUsers = [];
  var allGyms = [];
  var editingGymId = null;
  var historyOpenGymId = null; // 부가정보 이력을 펼쳐놓은 헬스장 id (한 번에 하나만)
  var historyCache = {}; // gym_id -> 이력 배열 (다시 펼칠 때 재조회 방지)

  function renderManage(sb, user, renderLogin) {
    currentUser = user;
    app.innerHTML =
      '<div class="top-row">' +
      '  <div><h1 style="margin-bottom:0">GymPrice Admin</h1>' +
      '  <div class="who">' + G.escapeHtml(user.nickname || user.email) + '님으로 로그인됨</div></div>' +
      '  <button class="btn-ghost" id="logout">로그아웃</button>' +
      '</div>' +
      G.renderNav("manage") +
      '<div class="tabs">' +
      '  <div class="tab" data-tab="users">유저</div>' +
      '  <div class="tab" data-tab="gyms">헬스장</div>' +
      '</div>' +
      '<div id="manage-body"><div class="empty">불러오는 중...</div></div>';

    document.getElementById("logout").onclick = function () {
      sb.auth.signOut().then(function () { renderLogin(); });
    };
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (el) {
      el.onclick = function () {
        currentTab = el.getAttribute("data-tab");
        syncTabs();
        renderCurrentTab(sb);
      };
    });
    syncTabs();
    loadUsers(sb);
    loadGyms(sb);
    G.loadPendingBadge(sb);
  }

  function syncTabs() {
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (el) {
      el.classList.toggle("active", el.getAttribute("data-tab") === currentTab);
    });
  }

  function renderCurrentTab(sb) {
    if (currentTab === "users") renderUsers(sb, allUsers);
    else renderGyms(sb, allGyms);
  }

  // ---------- 유저 탭 (테이블) ----------
  function loadUsers(sb) {
    sb.from("users")
      .select("uid, nickname, email, is_admin, is_suspended, created_at")
      .order("created_at", { ascending: false })
      .then(function (res) {
        if (res.error) {
          document.getElementById("manage-body").innerHTML =
            '<div class="error-text">유저 목록을 불러오지 못했습니다: ' + G.escapeHtml(res.error.message) + '</div>';
          return;
        }
        allUsers = res.data || [];
        if (currentTab === "users") renderUsers(sb, allUsers);
      });
  }

  function renderUsers(sb, users) {
    var body = document.getElementById("manage-body");
    body.innerHTML =
      '<input id="user-search" placeholder="닉네임 또는 이메일로 검색" style="margin-bottom:12px" />' +
      '<div id="user-table"></div>';

    function draw(list) {
      var wrapEl = document.getElementById("user-table");
      if (list.length === 0) {
        wrapEl.innerHTML = '<div class="empty">해당하는 유저가 없습니다.</div>';
        return;
      }
      var rows = list
        .map(function (u) {
          var isSelf = u.uid === currentUser.id;
          var badges = "";
          if (u.is_admin) badges += '<span class="status-badge status-approved">관리자</span> ';
          if (u.is_suspended) badges += '<span class="status-badge status-rejected">정지됨</span>';
          if (!badges) badges = '<span class="cell-muted">-</span>';
          // 관리자는 자기 자신을 정지시키거나 자기 권한을 해제할 수 없다
          // (DB 트리거로도 막혀있지만, 헷갈리지 않게 버튼 자체를 안 보여준다).
          var actionsHtml = isSelf
            ? '<span class="cell-muted">본인 계정은 여기서 변경할 수 없어요</span>'
            : (
                '  <button class="' + (u.is_admin ? "btn-reject" : "btn-approve") + '" data-toggle-admin="' + u.uid + '" data-next="' + (!u.is_admin) + '">' +
                (u.is_admin ? "권한 해제" : "관리자로 지정") +
                "</button>" +
                '  <button class="' + (u.is_suspended ? "btn-approve" : "btn-reject") + '" data-toggle-suspend="' + u.uid + '" data-next="' + (!u.is_suspended) + '">' +
                (u.is_suspended ? "정지 해제" : "정지") +
                "</button>"
              );

          return (
            "<tr>" +
            "<td>" + G.escapeHtml(u.nickname || "(닉네임 없음)") + (isSelf ? ' <span class="cell-muted">(나)</span>' : "") + "</td>" +
            "<td>" + G.escapeHtml(u.email) + "</td>" +
            '<td class="cell-muted">' + G.fmtDate(u.created_at) + "</td>" +
            "<td>" + badges + "</td>" +
            '<td><div class="cell-actions">' + actionsHtml + "</div></td>" +
            "</tr>"
          );
        })
        .join("");

      wrapEl.innerHTML =
        '<div class="table-wrap"><table class="data-table">' +
        "<thead><tr><th>닉네임</th><th>이메일</th><th>가입일</th><th>상태</th><th>작업</th></tr></thead>" +
        "<tbody>" + rows + "</tbody>" +
        "</table></div>";

      Array.prototype.forEach.call(wrapEl.querySelectorAll("button[data-toggle-admin]"), function (btn) {
        btn.onclick = function () {
          var uid = btn.getAttribute("data-toggle-admin");
          var next = btn.getAttribute("data-next") === "true";
          var confirmMsg = next
            ? "이 유저에게 관리자 권한을 부여할까요?"
            : "이 유저의 관리자 권한을 해제할까요?";
          if (!confirm(confirmMsg)) return;
          btn.disabled = true;
          sb.from("users").update({ is_admin: next }).eq("uid", uid).then(function (res) {
            if (res.error) {
              alert("처리 실패: " + res.error.message);
              btn.disabled = false;
              return;
            }
            loadUsers(sb);
          });
        };
      });

      Array.prototype.forEach.call(wrapEl.querySelectorAll("button[data-toggle-suspend]"), function (btn) {
        btn.onclick = function () {
          var uid = btn.getAttribute("data-toggle-suspend");
          var next = btn.getAttribute("data-next") === "true";
          var confirmMsg = next
            ? "이 유저를 정지할까요? 헬스장/가격/부가정보 등록이 모두 막힙니다."
            : "이 유저의 정지를 해제할까요?";
          if (!confirm(confirmMsg)) return;
          btn.disabled = true;
          sb.from("users").update({ is_suspended: next }).eq("uid", uid).then(function (res) {
            if (res.error) {
              alert("처리 실패: " + res.error.message);
              btn.disabled = false;
              return;
            }
            loadUsers(sb);
          });
        };
      });
    }

    draw(users);
    document.getElementById("user-search").addEventListener("input", function (e) {
      var q = e.target.value.trim().toLowerCase();
      if (!q) { draw(users); return; }
      draw(
        users.filter(function (u) {
          return (
            (u.nickname || "").toLowerCase().indexOf(q) !== -1 ||
            (u.email || "").toLowerCase().indexOf(q) !== -1
          );
        })
      );
    });
  }

  // ---------- 헬스장 탭 (테이블) ----------
  function loadGyms(sb) {
    sb.from("gyms")
      .select("id, name, address, phone, created_at")
      .order("created_at", { ascending: false })
      .then(function (res) {
        if (res.error) {
          document.getElementById("manage-body").innerHTML =
            '<div class="error-text">헬스장 목록을 불러오지 못했습니다: ' + G.escapeHtml(res.error.message) + '</div>';
          return;
        }
        allGyms = res.data || [];
        if (currentTab === "gyms") renderGyms(sb, allGyms);
      });
  }

  function gymRowView(g) {
    return (
      "<tr>" +
      "<td>" + G.escapeHtml(g.name) + "</td>" +
      "<td>" + G.escapeHtml(g.address) + "</td>" +
      '<td class="cell-muted">' + G.fmtDate(g.created_at) + "</td>" +
      '<td><div class="cell-actions">' +
      '  <button class="btn-ghost" data-edit-gym="' + g.id + '">수정</button>' +
      '  <button class="btn-ghost" data-toggle-history="' + g.id + '">부가정보 이력</button>' +
      '  <button class="btn-reject" data-delete-gym="' + g.id + '">삭제</button>' +
      "</div></td>" +
      "</tr>"
    );
  }

  /** 헬스장 행 아래 펼쳐지는 부가정보(gym_details) 수정 이력 패널 */
  function gymHistoryRow(gymId) {
    var entries = historyCache[gymId];
    var content;
    if (!entries) {
      content = '<div class="empty">불러오는 중...</div>';
    } else if (entries.length === 0) {
      content = '<div class="empty">수정 이력이 없습니다.</div>';
    } else {
      content =
        '<div class="table-wrap"><table class="data-table">' +
        "<thead><tr><th>변경일시</th><th>변경자</th><th>장비 브랜드</th><th>청결도</th><th>트레이너 수</th><th>메모</th></tr></thead>" +
        "<tbody>" +
        entries
          .map(function (h) {
            var changer = h.users ? h.users.nickname || h.users.email : "알 수 없음";
            return (
              "<tr>" +
              '<td class="cell-muted">' + G.fmtDate(h.changed_at) + "</td>" +
              "<td>" + G.escapeHtml(changer) + "</td>" +
              "<td>" + G.escapeHtml(h.equipment_brand || "-") + "</td>" +
              "<td>" + (h.cleanliness != null ? h.cleanliness + "/5" : "-") + "</td>" +
              "<td>" + (h.trainer_count != null ? h.trainer_count + "명" : "-") + "</td>" +
              "<td>" + G.escapeHtml(h.memo || "-") + "</td>" +
              "</tr>"
            );
          })
          .join("") +
        "</tbody></table></div>";
    }
    return (
      '<tr class="history-row"><td colspan="4">' +
      '<div class="section-title" style="margin-top:0">부가정보 수정 이력</div>' +
      content +
      "</td></tr>"
    );
  }

  function gymRowEdit(g) {
    return (
      '<tr data-edit-row="' + g.id + '">' +
      '<td><input class="edit-name" value="' + G.escapeHtml(g.name) + '" /></td>' +
      '<td><input class="edit-address" value="' + G.escapeHtml(g.address) + '" /></td>' +
      '<td class="cell-muted">전화: <input class="edit-phone" value="' + G.escapeHtml(g.phone || "") + '" placeholder="선택" /></td>' +
      '<td><div class="cell-actions">' +
      '  <button class="btn-approve" data-save-gym="' + g.id + '">저장</button>' +
      '  <button class="btn-ghost" data-cancel-edit="' + g.id + '">취소</button>' +
      "</div></td>" +
      "</tr>"
    );
  }

  function renderGyms(sb, gyms) {
    var body = document.getElementById("manage-body");
    if (gyms.length === 0) {
      body.innerHTML = '<div class="empty">등록된 헬스장이 없습니다.</div>';
      return;
    }
    var rows = gyms
      .map(function (g) {
        var row = g.id === editingGymId ? gymRowEdit(g) : gymRowView(g);
        if (g.id === historyOpenGymId) row += gymHistoryRow(g.id);
        return row;
      })
      .join("");

    body.innerHTML =
      '<div class="table-wrap"><table class="data-table">' +
      "<thead><tr><th>이름</th><th>주소</th><th>등록일</th><th>작업</th></tr></thead>" +
      "<tbody>" + rows + "</tbody>" +
      "</table></div>";

    Array.prototype.forEach.call(body.querySelectorAll("button[data-edit-gym]"), function (btn) {
      btn.onclick = function () {
        editingGymId = btn.getAttribute("data-edit-gym");
        renderGyms(sb, allGyms);
      };
    });
    Array.prototype.forEach.call(body.querySelectorAll("button[data-cancel-edit]"), function (btn) {
      btn.onclick = function () {
        editingGymId = null;
        renderGyms(sb, allGyms);
      };
    });
    Array.prototype.forEach.call(body.querySelectorAll("button[data-toggle-history]"), function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-toggle-history");
        if (historyOpenGymId === id) {
          historyOpenGymId = null;
          renderGyms(sb, allGyms);
          return;
        }
        historyOpenGymId = id;
        renderGyms(sb, allGyms); // 먼저 "불러오는 중" 상태로 펼쳐 보여준다
        if (!historyCache[id]) {
          sb.from("gym_details_history")
            .select("*, users(nickname, email)")
            .eq("gym_id", id)
            .order("changed_at", { ascending: false })
            .then(function (res) {
              historyCache[id] = res.error ? [] : res.data || [];
              if (historyOpenGymId === id) renderGyms(sb, allGyms);
            });
        }
      };
    });
    Array.prototype.forEach.call(body.querySelectorAll("button[data-save-gym]"), function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-save-gym");
        var rowEl = body.querySelector('tr[data-edit-row="' + id + '"]');
        var name = rowEl.querySelector(".edit-name").value.trim();
        var address = rowEl.querySelector(".edit-address").value.trim();
        var phone = rowEl.querySelector(".edit-phone").value.trim();
        if (!name || !address) {
          alert("이름과 주소는 비워둘 수 없습니다.");
          return;
        }
        btn.disabled = true;
        sb.from("gyms")
          .update({ name: name, address: address, phone: phone === "" ? null : phone })
          .eq("id", id)
          .then(function (res) {
            if (res.error) {
              alert("수정 실패: " + res.error.message);
              btn.disabled = false;
              return;
            }
            editingGymId = null;
            loadGyms(sb);
          });
      };
    });
    Array.prototype.forEach.call(body.querySelectorAll("button[data-delete-gym]"), function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-delete-gym");
        if (!confirm("이 헬스장과 등록된 모든 가격 제보가 함께 삭제됩니다. 계속할까요?")) return;
        btn.disabled = true;
        sb.from("gyms").delete().eq("id", id).then(function (res) {
          if (res.error) {
            alert("삭제 실패: " + res.error.message);
            btn.disabled = false;
            return;
          }
          loadGyms(sb);
        });
      };
    });
  }

  G.boot(app, renderManage, "유저 / 헬스장을 관리하세요.");
})();
</script>
</body>
</html>
